name: frontend-deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'packages/share/types/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'frontend/wrangler.toml'
      - '.github/workflows/frontend-deploy.yml'

concurrency:
  group: frontend-deploy-main
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Vite
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('frontend/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: check
        run: pnpm --filter frontend check

      - name: test
        run: pnpm --filter frontend test -- --run

      - name: build
        run: pnpm --filter frontend build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@3 pages deploy dist --project-name=ja-tools --commit-dirty=true
